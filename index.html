<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>攒息账本</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#c9772e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🫙</span>
      <div>
        <div class="title">攒息账本</div>
        <div class="sub" id="updatedAt">行情加载中…</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="refreshBtn" title="刷新行情（自动拉取最新价）">刷新</button>
      <button class="icon-btn" id="importBtn" title="导入备份">导入</button>
      <button class="icon-btn" id="exportBtn" title="导出备份">导出</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden />
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="holdings">持仓账本</button>
    <button class="tab" data-tab="calendar">收息日历</button>
    <button class="tab" data-tab="watch">心选</button>
  </nav>

  <main>
    <!-- 持仓账本 -->
    <section id="holdings" class="panel active">
      <div class="summary" id="holdSummary"></div>
      <div class="hold-tools">
        <span class="hold-tools-tip">市值 / 成本 / 盈亏 / 回本</span>
        <button class="eye-btn" id="eyeBtn" title="点击屏蔽敏感数据"></button>
      </div>
      <div class="list" id="holdList"></div>
      <button class="add-btn" data-add="holding">+ 新增持仓</button>
    </section>

    <!-- 收息日历 -->
    <section id="calendar" class="panel">
      <div class="summary" id="calSummary"></div>
      <div class="card">
        <div class="card-h">月度现金流（按派息月份）</div>
        <div class="flow" id="flowChart"></div>
      </div>
      <div class="list" id="eventList"></div>
      <button class="add-btn" data-add="event">+ 登记派息</button>
    </section>

    <!-- 心选 -->
    <section id="watch" class="panel">
      <div class="list" id="watchList"></div>
      <button class="add-btn" data-add="watch">+ 新增心选</button>
    </section>
  </main>

  <!-- 弹窗表单 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <div class="modal-h" id="modalTitle">新增</div>
      <form id="modalForm"></form>
      <div class="modal-foot">
        <button type="button" class="ghost" id="cancelBtn">取消</button>
        <button type="button" class="primary" id="saveBtn">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="seed.js"></script>
  <script src="seed.example.js"></script>
  <script src="market.js"></script>
  <script src="market.example.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && window.location.protocol.indexOf('http') === 0) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  </script>
</body>
</html>
